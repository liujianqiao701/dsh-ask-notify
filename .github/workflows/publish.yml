name: publish

# ============================================================================
# ⚠️ 当前状态（2026-09-24）：**仅手动触发** —— 发布 Release 不会自动跑。
#
# 原因：npm 站点侧的 Trusted Publisher 没能建起来。要修改「包的安全设置」，
# npm 要求账号先开 2FA；而当时那条流程只提供 Security key（硬件密钥 / Windows
# Hello），没有手机验证器（TOTP）选项，于是**暂缓配置**、改回 token 发布。
#
# 证据（Actions run #4 的 npm 12.1.0 调试日志，实测而非推测）：
#   28 http fetch GET  ...actions.githubusercontent.com/.../idtoken/... 200
#      → GitHub 确实把 OIDC 票据交出来了
#   30 http fetch POST 404 .../-/npm/v1/oidc/token/exchange/package/dsh-ask-notify
#   31 verbose oidc Failed token exchange request with body message:
#        OIDC token exchange error - package not found
#      → 注册表里没有这条信任记录（与站点上仍是 "Select your publisher" 完全一致），
#        于是 npm 回退成 need auth（ENEEDAUTH）
#
# 将来想启用，三步：
#   ① npm 账号开 2FA（手机验证器 App 最便携；本机 PIN 走 Security key 也行，
#      但凭证绑定设备，恢复码务必留存）
#   ② 包 Settings → Trusted Publisher → GitHub Actions 填：
#        Organization or user : liujianqiao701
#        Repository           : dsh-ask-notify
#        Workflow filename    : publish.yml      ← 只填文件名，别带路径
#        Environment          : 留空
#        Allowed actions      : ✅ Allow npm publish  ← 不勾只能 stage，直接发布会 ENEEDAUTH
#      然后点 Set up connection
#   ③ 把下面 `release:` 的触发加回来（加回前也可先手动 Run workflow 验证）
#
# 在此之前照旧用 token 发布：bypass-2FA 的 granular access token（实测可用）。
# ============================================================================

on:
  workflow_dispatch:        # 仅手动：Actions 页面 → Run workflow
  # release:
  #   types: [published]    # ← 站点配好 Trusted Publisher 后再取消注释

permissions:
  contents: read
  id-token: write   # ← Trusted Publishing 必需：向 npm 换取短时凭证

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          # 刻意不设 registry-url：那会写出一行 ${NODE_AUTH_TOKEN} 占位，
          # 反而让 npm 以为要走 token 认证。默认 registry 就是 registry.npmjs.org。

      - name: 升级 npm（Trusted Publishing 需要 npm >= 11.5.1）
        run: npm install -g npm@latest

      - name: 诊断（OIDC 环境 / npm 版本）
        run: |
          node -v
          npm -v
          node -p "'package version: ' + require('./package.json').version"
          for v in ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN; do
            if [ -n "${!v}" ]; then echo "$v = <set>"; else echo "$v = <MISSING>"; fi
          done
          npm config get registry

      - name: 发布到 npm（带 provenance）
        run: npm publish --provenance --access public

      - name: 失败时导出 npm 调试日志（看注册表对 OIDC 的原始答复）
        if: failure()
        run: |
          for f in /home/runner/.npm/_logs/*-debug-0.log; do
            echo "===== $f ====="
            grep -i -E 'oidc|trusted|exchange|http fetch|http request|=20[0-9]|=4[0-9][0-9]|token|eneedauth|provenance' "$f" | tail -60
          done